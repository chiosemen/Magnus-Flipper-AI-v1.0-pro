# ⚠️ DISABLED: This workflow has been consolidated into ci-invariant.yml
# This file is preserved for history but will not run
# All CI logic has been moved to .github/workflows/ci-invariant.yml

name: 🚀 CI — Mobile App (DISABLED)

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - ".github/workflows/ci-mobile.yml"

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  pull-requests: write

jobs:
  # This job is disabled - all logic moved to ci-invariant.yml
  lint-and-typecheck:
    if: false  # DISABLED: Use ci-invariant.yml instead
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 🛡️ CI Preflight
        run: bash scripts/ci-preflight.sh

      - name: 📦 Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: 🔨 Build workspace packages
        run: pnpm build:packages

      - name: 🔍 Lint
        run: pnpm --filter @magnus-flipper-ai/mobile lint

      - name: 📝 Type check
        run: pnpm --filter @magnus-flipper-ai/mobile type-check

      - name: 📊 CI Summary
        run: |
          echo "## ✅ Mobile App CI Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint check passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type check passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Note: Tests and builds are handled separately (EAS for builds)"
