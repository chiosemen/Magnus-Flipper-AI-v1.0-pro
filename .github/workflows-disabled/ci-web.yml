# ⚠️ DISABLED: This workflow has been consolidated into ci-invariant.yml
# This file is preserved for history but will not run
# All CI logic has been moved to .github/workflows/ci-invariant.yml

name: 🚀 CI — Web App (DISABLED)

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/core/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/core/**"
      - ".github/workflows/ci-web.yml"

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  pull-requests: write

jobs:
  # All jobs disabled - logic moved to ci-invariant.yml
  lint-and-typecheck:
    if: false  # DISABLED: Use ci-invariant.yml instead
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 🛡️ CI Preflight
        run: bash scripts/ci-preflight.sh

      - name: 📦 Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: 🔨 Build workspace packages
        run: pnpm build:packages

      - name: 🔍 Lint
        run: pnpm --filter web lint

      - name: 📝 Type check
        run: pnpm --filter web typecheck

  test:
    if: false  # DISABLED: Use ci-invariant.yml instead
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 🛡️ CI Preflight
        run: bash scripts/ci-preflight.sh

      - name: 📦 Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: 🔨 Build workspace packages
        run: pnpm build:packages

      - name: 🧪 Run tests
        run: pnpm --filter web test

  build:
    if: false  # DISABLED: Use ci-invariant.yml instead
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 🛡️ CI Preflight
        run: bash scripts/ci-preflight.sh

      - name: 📦 Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: 🏗️ Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
        run: |
          pnpm build:web || exit 1

      - name: 📊 Build summary
        run: |
          echo "## ✅ Web App CI Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint check" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type check" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build successful" >> $GITHUB_STEP_SUMMARY
