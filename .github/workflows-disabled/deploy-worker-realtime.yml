name: Deploy Worker Realtime

on:
  push:
    branches:
      - main
    paths:
      - "apps/worker-realtime/**"
      - "packages/marketplace-config/**"
      - "packages/rate-limiter/**"
      - ".github/workflows/deploy-worker-realtime.yml"

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RG }}
  ACR_NAME: ${{ secrets.ACR_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push Image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/worker-realtime:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/worker-realtime:latest \
            -f apps/worker-realtime/Dockerfile .
          
          docker push ${{ env.ACR_NAME }}.azurecr.io/worker-realtime:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/worker-realtime:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name magnus-worker-realtime \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/worker-realtime:${{ github.sha }}
