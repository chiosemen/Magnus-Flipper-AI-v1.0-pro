name: 🔵🟢 Promote Canary to 100%

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Worker app (mf-worker-realtime or mf-worker-scheduler)'
        required: true
        default: 'mf-worker-realtime'

env:
  AZURE_RESOURCE_GROUP: 'magnus-rg'

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    name: 🔵🟢 Promote Canary Revision
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repo
      uses: actions/checkout@v4

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: 🧮 Install jq
      run: sudo apt-get update -y && sudo apt-get install -y jq

    - name: 🔎 Identify canary revision
      id: rev
      run: |
        APP="${{ github.event.inputs.app_name }}"

        ACTIVE=$(az containerapp revision list \
          --name "$APP" \
          --resource-group $AZURE_RESOURCE_GROUP \
          --query "[?properties.active==\`true\`]" -o json)

        LATEST=$(echo "$ACTIVE" | jq -r 'sort_by(.properties.createdTime) | last(.[]).name')

        echo "latest=$LATEST" >> $GITHUB_OUTPUT

    - name: 🔵🟢 Route 100% traffic to new revision
      run: |
        APP="${{ github.event.inputs.app_name }}"
        NEW="${{ steps.rev.outputs.latest }}"

        echo "🚀 Promoting $APP revision $NEW to 100% traffic..."

        az containerapp ingress traffic set \
          --name "$APP" \
          --resource-group $AZURE_RESOURCE_GROUP \
          --traffic revisionName=$NEW=100

        echo "🎉 Promotion successful."

    - name: ❤️ Health Check After Promotion
      run: |
        APP="${{ github.event.inputs.app_name }}"

        FQDN=$(az containerapp show \
          --name "$APP" \
          --resource-group $AZURE_RESOURCE_GROUP \
          --query properties.configuration.ingress.fqdn -o tsv)

        echo "Checking /health at https://$FQDN/health"

        curl -f https://$FQDN/health || exit 1

        echo "💚 New revision healthy. Promotion confirmed."
