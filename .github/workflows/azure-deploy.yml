name: Azure Container Apps Deploy

on:
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: 'Skip Terraform apply (only update container images)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker-alerts/**"
      - "packages/**"
      - "Dockerfile.api"
      - "Dockerfile.worker-alerts"
      - "infra/azure/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/azure-deploy.yml"

env:
  AZURE_REGION: eastus
  ACR_NAME: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  API_IMAGE_NAME: magnus-api
  WORKER_IMAGE_NAME: alerts-worker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build and push API image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Building API image: $ACR_NAME.azurecr.io/$API_IMAGE_NAME:$IMAGE_TAG"

          docker build \
            -f Dockerfile.api \
            -t $ACR_NAME.azurecr.io/$API_IMAGE_NAME:$IMAGE_TAG \
            -t $ACR_NAME.azurecr.io/$API_IMAGE_NAME:latest \
            .

          docker push $ACR_NAME.azurecr.io/$API_IMAGE_NAME:$IMAGE_TAG
          docker push $ACR_NAME.azurecr.io/$API_IMAGE_NAME:latest

      - name: Build and push Worker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Building Worker image: $ACR_NAME.azurecr.io/$WORKER_IMAGE_NAME:$IMAGE_TAG"

          docker build \
            -f Dockerfile.worker-alerts \
            -t $ACR_NAME.azurecr.io/$WORKER_IMAGE_NAME:$IMAGE_TAG \
            -t $ACR_NAME.azurecr.io/$WORKER_IMAGE_NAME:latest \
            .

          docker push $ACR_NAME.azurecr.io/$WORKER_IMAGE_NAME:$IMAGE_TAG
          docker push $ACR_NAME.azurecr.io/$WORKER_IMAGE_NAME:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        if: github.event.inputs.skip_terraform != 'true'
        working-directory: infra/azure
        run: terraform init

      - name: Terraform Plan
        if: github.event.inputs.skip_terraform != 'true'
        working-directory: infra/azure
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
          TF_VAR_supabase_url: ${{ secrets.TF_VAR_supabase_url }}
          TF_VAR_supabase_anon_key: ${{ secrets.TF_VAR_supabase_anon_key }}
          TF_VAR_supabase_service_role_key: ${{ secrets.TF_VAR_supabase_service_role_key }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
          TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_stripe_secret_key }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_stripe_webhook_secret }}
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.skip_terraform != 'true' && github.ref == 'refs/heads/main'
        working-directory: infra/azure
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
          TF_VAR_supabase_url: ${{ secrets.TF_VAR_supabase_url }}
          TF_VAR_supabase_anon_key: ${{ secrets.TF_VAR_supabase_anon_key }}
          TF_VAR_supabase_service_role_key: ${{ secrets.TF_VAR_supabase_service_role_key }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
          TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_stripe_secret_key }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_stripe_webhook_secret }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Update API Container App
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Updating API Container App with image: $ACR_NAME.azurecr.io/$API_IMAGE_NAME:$IMAGE_TAG"

          az containerapp update \
            --name magnus-api \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$API_IMAGE_NAME:$IMAGE_TAG \
            || echo "⚠️  API update failed - this is expected if resources don't exist yet"

      - name: Update Worker Job
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "Updating Worker Job with image: $ACR_NAME.azurecr.io/$WORKER_IMAGE_NAME:$IMAGE_TAG"

          az containerapp job update \
            --name worker-alerts-job \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$WORKER_IMAGE_NAME:$IMAGE_TAG \
            || echo "⚠️  Worker update failed - this is expected if resources don't exist yet"

      - name: Get API URL
        id: get_api_url
        run: |
          API_FQDN=$(az containerapp show \
            --name magnus-api \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            --output tsv 2>/dev/null || echo "not-deployed-yet")

          echo "api_url=https://$API_FQDN" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built & Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: \`$ACR_NAME.azurecr.io/$API_IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: \`$ACR_NAME.azurecr.io/$WORKER_IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Resources" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: $AZURE_REGION" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group**: $RESOURCE_GROUP" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${{ steps.get_api_url.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Check" >> $GITHUB_STEP_SUMMARY
          echo "Test the API: \`curl ${{ steps.get_api_url.outputs.api_url }}/health\`" >> $GITHUB_STEP_SUMMARY
