name: Azure Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker-alerts/**"
      - "apps/worker-analyzer/**"
      - "apps/worker-crawler/**"
      - "apps/scheduler/**"
      - "Dockerfile.api"
      - "Dockerfile.worker-alerts"
      - "Dockerfile.scheduler"
      - "pnpm-lock.yaml"
      - ".github/workflows/azure-deploy.yml"
      - "infra/azure/**"

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: infra/azure
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/azure
        run: terraform plan -var="image_tag=${{ github.sha }}"
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ secrets.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TF_VAR_acr_name: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          TF_VAR_containerapps_env_name: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_openai_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_app_url: ${{ secrets.APP_URL }}

      - name: Build and push images to ACR
        run: |
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus-api:${{ github.sha }} --image magnus-api:latest -f Dockerfile.api .
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus-worker-alerts:${{ github.sha }} --image magnus-worker-alerts:latest -f Dockerfile.worker-alerts .
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus-worker-crawler:${{ github.sha }} --image magnus-worker-crawler:latest -f Dockerfile.worker-crawler .
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus-scheduler:${{ github.sha }} --image magnus-scheduler:latest -f Dockerfile.scheduler .

      - name: Terraform Apply
        working-directory: infra/azure
        run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}"
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ secrets.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TF_VAR_acr_name: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          TF_VAR_containerapps_env_name: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_openai_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_app_url: ${{ secrets.APP_URL }}

      - name: Summary
        run: |
          echo "## Azure Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- API: magnus-api:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Worker Alerts: magnus-worker-alerts:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Worker Crawler: magnus-worker-crawler:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Scheduler: magnus-scheduler:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
