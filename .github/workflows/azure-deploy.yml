name: Azure Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker-alerts/**"
      - "apps/worker-analyzer/**"
      - "apps/worker-crawler/**"
      - "apps/web/**"
      - "Dockerfile.api"
      - "Dockerfile.worker-alerts"
      - "Dockerfile.worker-analyzer"
      - "Dockerfile.worker-crawler"
      - "Dockerfile.web"
      - "pnpm-lock.yaml"
      - ".github/workflows/azure-deploy.yml"

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_API_APP: magnus-api
  AZURE_WEB_APP: magnus-web
  AZURE_ALERTS_JOB: magnus-worker-alerts
  AZURE_ANALYZER_JOB: magnus-worker-analyzer
  AZURE_CRAWLER_JOB: magnus-worker-crawler

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push images to ACR
        run: |
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus/api:${{ github.sha }} -f Dockerfile.api .
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus/worker-alerts:${{ github.sha }} -f Dockerfile.worker-alerts .
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus/worker-analyzer:${{ github.sha }} -f Dockerfile.worker-analyzer .
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus/worker-crawler:${{ github.sha }} -f Dockerfile.worker-crawler .
          az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image magnus/web:${{ github.sha }} -f Dockerfile.web .

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update --name "$AZURE_API_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/api:${{ github.sha }}" || true
          az containerapp update --name "$AZURE_WEB_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/web:${{ github.sha }}" || true
          az containerapp job update --name "$AZURE_ALERTS_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/worker-alerts:${{ github.sha }}" || true
          az containerapp job update --name "$AZURE_ANALYZER_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/worker-analyzer:${{ github.sha }}" || true
          az containerapp job update --name "$AZURE_CRAWLER_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/worker-crawler:${{ github.sha }}" || true

      - name: Summary
        run: |
          echo "## Azure Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- API image: $AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/api:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web image: $AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/web:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Alerts job: $AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/worker-alerts:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Analyzer job: $AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/worker-analyzer:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Crawler job: $AZURE_CONTAINER_REGISTRY.azurecr.io/magnus/worker-crawler:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
