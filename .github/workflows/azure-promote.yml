name: Azure Promote

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote (e.g., commit SHA)'
        required: true
        type: string

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: infra/azure
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/azure
        run: terraform plan -var="image_tag=${{ inputs.image_tag }}"
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ secrets.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TF_VAR_acr_name: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          TF_VAR_containerapps_env_name: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_openai_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_app_url: ${{ secrets.APP_URL }}
          TF_VAR_demo_mode: "false"
          TF_VAR_log_level: "info"

      - name: Terraform Apply
        working-directory: infra/azure
        run: terraform apply -auto-approve -var="image_tag=${{ inputs.image_tag }}"
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ secrets.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TF_VAR_acr_name: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          TF_VAR_containerapps_env_name: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_openai_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_app_url: ${{ secrets.APP_URL }}
          TF_VAR_demo_mode: "false"
          TF_VAR_log_level: "info"

      - name: Summary
        run: |
          echo "## Azure Promotion Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Promoted image tag: ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- API: magnus-api:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Worker Alerts: magnus-worker-alerts:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Worker Crawler: magnus-worker-crawler:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Scheduler: magnus-scheduler:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
