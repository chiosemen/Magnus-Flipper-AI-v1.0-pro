name: Promote Image to Production (Azure)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA or specific tag to promote"
        required: true
        type: string

jobs:
  promote:
    name: Promote Image to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: infra/azure
        run: terraform init

      - name: Terraform Plan with Promotion Tag
        working-directory: infra/azure
        run: terraform plan -var="image_tag=${{ github.event.inputs.image_tag }}"
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_openai_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_app_url: ${{ secrets.APP_URL }}
          TF_VAR_node_env: "production"
          TF_VAR_demo_mode: "false"
          TF_VAR_log_level: "info"

      - name: Terraform Apply (Production)
        working-directory: infra/azure
        run: terraform apply -auto-approve -var="image_tag=${{ github.event.inputs.image_tag }}"
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_supabase_anon_key: ${{ secrets.SUPABASE_ANON_KEY }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_openai_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_app_url: ${{ secrets.APP_URL }}
          TF_VAR_node_env: "production"
          TF_VAR_demo_mode: "false"
          TF_VAR_log_level: "info"

      - name: Smoke Test After Promotion
        run: bash scripts/deploy/smoke.sh "${{ secrets.APP_URL }}"

      - name: Summary
        run: |
          echo "## Azure Promote Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Promoted tag: ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke test completed" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform apply succeeded" >> $GITHUB_STEP_SUMMARY
