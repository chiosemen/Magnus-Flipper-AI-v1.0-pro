name: 🛡️ CI Invariant

# CI Invariant Workflow
# This is the ONLY CI gate for pull requests
# All other CI workflows are disabled/archived
# Enforces: Preflight → Packages → Mobile/Web Validation

on:
  pull_request:
    branches:
      - main
    # Path filters: Only run when relevant files change
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/ci-invariant.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile*"
      - "scripts/ci-preflight.sh"

# EXPLICITLY DISABLED: push to main
# CI must NOT run on push to main (only on PRs)

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  pull-requests: write

jobs:
  preflight:
    name: 🛡️ Preflight Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 🛡️ CI Preflight
        run: bash scripts/ci-preflight.sh

  packages:
    name: 📦 Workspace Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 📦 Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: 🔨 Build workspace packages
        run: pnpm build:packages

  mobile:
    name: 📱 Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: packages

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 📦 Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: 🔨 Build workspace packages
        run: pnpm build:packages

      - name: 🔍 Lint
        run: pnpm --filter @magnus-flipper-ai/mobile lint

      - name: 📝 Type check
        run: pnpm --filter @magnus-flipper-ai/mobile type-check

  web:
    name: 🌐 Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: packages

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 📦 Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: 🔨 Build workspace packages
        run: pnpm build:packages

      - name: 🔍 Lint
        run: pnpm --filter web lint

      - name: 📝 Type check
        run: pnpm --filter web typecheck

      - name: 🧪 Test
        run: pnpm --filter web test

      - name: 🏗️ Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
        run: |
          pnpm build:web
