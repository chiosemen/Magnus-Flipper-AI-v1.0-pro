name: 🚀 CI — Web App

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/core/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/core/**"
      - ".github/workflows/ci-web.yml"

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm --filter web lint

      - name: 📝 Type check
        run: pnpm --filter web typecheck

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm --filter web test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: 🟣 Install pnpm
        run: |
          npm install -g pnpm
          pnpm --version

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
        run: |
          pnpm --filter web build || exit 1

      - name: 📊 Build summary
        run: |
          echo "## ✅ Web App CI Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint check" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type check" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build successful" >> $GITHUB_STEP_SUMMARY
