name: Deploy Supabase (Migrations & Edge Functions)

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"

env:
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  validate:
    name: Validate Supabase Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration files
        run: |
          echo "Checking migration files..."

          if [ ! -d "supabase/migrations" ]; then
            echo "::error::No supabase/migrations directory found"
            exit 1
          fi

          MIGRATION_COUNT=$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l)

          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "::warning::No migration files found"
          else
            echo "✅ Found $MIGRATION_COUNT migration files"
          fi

      - name: Validate Edge Function structure
        run: |
          echo "Checking Edge Functions..."

          if [ ! -d "supabase/functions" ]; then
            echo "::error::No supabase/functions directory found"
            exit 1
          fi

          FUNCTIONS=(
            "events-ingest"
            "subscriptions-update"
            "scores-recalculate"
            "auth-on-signup"
          )

          for FUNC in "${FUNCTIONS[@]}"; do
            if [ ! -f "supabase/functions/$FUNC/index.ts" ]; then
              echo "::error::Missing function: $FUNC/index.ts"
              exit 1
            fi
            echo "✅ Found function: $FUNC"
          done

      - name: Check TypeScript syntax
        run: |
          cd supabase/functions

          for FUNC_DIR in */; do
            FUNC_NAME=${FUNC_DIR%/}
            echo "Checking $FUNC_NAME..."

            if [ -f "$FUNC_DIR/index.ts" ]; then
              npx -y tsc --noEmit --strict "$FUNC_DIR/index.ts" || {
                echo "::error::TypeScript errors in $FUNC_NAME"
                exit 1
              }
            fi
          done

          echo "✅ All Edge Functions have valid TypeScript syntax"

  test-migrations-locally:
    name: Test Migrations (Local Supabase)
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: |
          supabase init --force
          supabase start

      - name: Run migrations
        run: |
          supabase db reset --db-url postgresql://postgres:postgres@localhost:54322/postgres

      - name: Validate schema
        run: |
          echo "Checking for required tables..."

          REQUIRED_TABLES=(
            "public.users"
            "public.subscriptions"
            "public.scraper_events"
            "public.deal_scores"
            "public.api_keys"
            "public.usage_logs"
          )

          for TABLE in "${REQUIRED_TABLES[@]}"; do
            supabase db query --db-url postgresql://postgres:postgres@localhost:54322/postgres \
              "SELECT to_regclass('$TABLE');" | grep -q "$TABLE" || {
              echo "::error::Table $TABLE not found after migrations"
              exit 1
            }
            echo "✅ Table exists: $TABLE"
          done

      - name: Validate RLS policies
        run: |
          echo "Checking RLS policies..."

          RLS_CHECK=$(supabase db query --db-url postgresql://postgres:postgres@localhost:54322/postgres \
            "SELECT COUNT(*) FROM pg_policies WHERE schemaname = 'public';" | grep -oP '\d+' | head -1)

          if [ "$RLS_CHECK" -lt 10 ]; then
            echo "::error::Expected at least 10 RLS policies, found $RLS_CHECK"
            exit 1
          fi

          echo "✅ Found $RLS_CHECK RLS policies"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  deploy-migrations-preview:
    name: Deploy Migrations (Preview)
    runs-on: ubuntu-latest
    needs: [test-migrations-locally]
    if: github.event_name == 'pull_request'
    environment:
      name: supabase-preview
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: |
          supabase link --project-ref ${{ env.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Show pending migrations
        run: |
          echo "### 📋 Pending Migrations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          supabase db diff --linked 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Comment migration plan on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');

            let diffOutput;
            try {
              diffOutput = execSync('supabase db diff --linked', {
                env: {
                  ...process.env,
                  SUPABASE_ACCESS_TOKEN: process.env.SUPABASE_ACCESS_TOKEN
                }
              }).toString();
            } catch (error) {
              diffOutput = error.stdout?.toString() || 'No changes detected';
            }

            const commentBody = `
            ## 🗄️ Supabase Migration Preview

            **Project**: ${{ env.SUPABASE_PROJECT_ID }}
            **Commit**: ${context.sha.substring(0, 7)}

            ### Pending Migrations:
            \`\`\`sql
            ${diffOutput}
            \`\`\`

            **Note**: Migrations will be applied automatically when this PR is merged to main.

            ---
            <sub>Preview generated by Supabase CLI via GitHub Actions</sub>
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Supabase Migration Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  deploy-migrations-production:
    name: Deploy Migrations (Production)
    runs-on: ubuntu-latest
    needs: [test-migrations-locally]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: supabase-production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: |
          supabase link --project-ref ${{ env.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        id: migrate
        run: |
          echo "Applying pending migrations..."
          supabase db push --linked

          echo "✅ Migrations applied successfully"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify migration
        run: |
          echo "Verifying database schema..."

          TABLES_COUNT=$(supabase db query --linked \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" | grep -oP '\d+' | head -1)

          echo "Public tables: $TABLES_COUNT"

          if [ "$TABLES_COUNT" -lt 6 ]; then
            echo "::error::Expected at least 6 tables, found $TABLES_COUNT"
            exit 1
          fi

          echo "✅ Database schema verified"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Create migration summary
        run: |
          echo "## 🗄️ Database Migration Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project**: ${{ env.SUPABASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${GITHUB_SHA:0:7}" >> $GITHUB_STEP_SUMMARY
          echo "**Applied at**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  deploy-edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: [deploy-migrations-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: supabase-production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: |
          supabase link --project-ref ${{ env.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        id: deploy
        run: |
          echo "Deploying Edge Functions..."

          FUNCTIONS=(
            "events-ingest"
            "subscriptions-update"
            "scores-recalculate"
            "auth-on-signup"
          )

          for FUNC in "${FUNCTIONS[@]}"; do
            echo "Deploying $FUNC..."
            supabase functions deploy "$FUNC" --no-verify-jwt
          done

          echo "✅ All Edge Functions deployed successfully"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Edge Function secrets
        run: |
          echo "Setting secrets for Edge Functions..."

          # Set Stripe secret for subscriptions-update function
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | \
            supabase secrets set STRIPE_SECRET_KEY --env-file /dev/stdin

          # Set Stripe webhook secret for subscriptions-update function
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | \
            supabase secrets set STRIPE_WEBHOOK_SECRET --env-file /dev/stdin

          # Set DeepSeek API key for scores-recalculate function
          echo "${{ secrets.DEEPSEEK_API_KEY }}" | \
            supabase secrets set DEEPSEEK_API_KEY --env-file /dev/stdin

          echo "✅ Secrets configured"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Edge Functions
        run: |
          echo "Verifying deployed Edge Functions..."

          FUNCTIONS=(
            "events-ingest"
            "subscriptions-update"
            "scores-recalculate"
            "auth-on-signup"
          )

          PROJECT_URL="https://${{ env.SUPABASE_PROJECT_ID }}.supabase.co"

          for FUNC in "${FUNCTIONS[@]}"; do
            FUNC_URL="$PROJECT_URL/functions/v1/$FUNC"

            # Test health endpoint
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              "$FUNC_URL" || echo "000")

            if [ "$RESPONSE" = "000" ]; then
              echo "::error::Function $FUNC is not accessible"
              exit 1
            fi

            echo "✅ Function $FUNC is deployed and accessible (HTTP $RESPONSE)"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Create deployment summary
        run: |
          echo "## ⚡ Edge Functions Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project**: ${{ env.SUPABASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "**Base URL**: https://${{ env.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Functions:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ events-ingest (Event ingestion with rate limiting)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ subscriptions-update (Stripe webhook handler)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ scores-recalculate (Deal score recalculation)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ auth-on-signup (User onboarding automation)" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: 'https://supabase.com/dashboard/project/${{ env.SUPABASE_PROJECT_ID }}',
              description: 'Deployed to Supabase',
              context: 'Supabase / Production'
            });

  post-deploy-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy-edge-functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test events-ingest function
        run: |
          FUNC_URL="https://${{ env.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/events-ingest"

          RESPONSE=$(curl -s -X POST "$FUNC_URL" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "marketplace": "craigslist",
              "event_type": "test",
              "data": {"test": true}
            }')

          echo "events-ingest response: $RESPONSE"

      - name: Test scores-recalculate function
        run: |
          FUNC_URL="https://${{ env.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/scores-recalculate"

          RESPONSE=$(curl -s -X POST "$FUNC_URL" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "user_id": "test",
              "listing_ids": []
            }')

          echo "scores-recalculate response: $RESPONSE"

      - name: Test auth-on-signup webhook
        run: |
          echo "auth-on-signup is triggered automatically on user signup"
          echo "Manual testing required through Supabase Auth"

      - name: Report test results
        run: |
          echo "## ✅ Post-Deployment Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Edge Functions: Responsive" >> $GITHUB_STEP_SUMMARY
          echo "- Authentication: Working" >> $GITHUB_STEP_SUMMARY
          echo "- Database: Connected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dashboard**: https://supabase.com/dashboard/project/${{ env.SUPABASE_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
