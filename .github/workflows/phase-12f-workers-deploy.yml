name: Phase 12F — Deploy Azure Workers

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "apps/worker-scraper/**"
      - "apps/worker-tracker/**"
      - "apps/worker-autosell/**"
      - "packages/**"
      - ".github/workflows/phase-12f-workers-deploy.yml"

env:
  AZURE_RESOURCE_GROUP: magnus-rg
  AZURE_CONTAINERAPPS_ENV: magnus-ca-env
  AZURE_CONTAINER_REGISTRY: magnusacr.azurecr.io
  SCRAPER_APP: worker-scraper
  TRACKER_APP: worker-tracker
  AUTOSELL_APP: worker-autosell

jobs:
  deploy-workers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # --- Azure login (Service Principal) ---
      # Create a service principal and store JSON in AZURE_CREDENTIALS secret:
      # az ad sp create-for-rbac --name magnus-gha-sp --role contributor \
      #   --scopes /subscriptions/<SUB_ID>/resourceGroups/magnus-rg \
      #   --sdk-auth
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure Subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # --- Docker / ACR login ---
      - name: Azure Container Registry Login
        run: |
          az acr login --name "${{ env.AZURE_CONTAINER_REGISTRY%%.* }}"

      # --- Node + pnpm setup ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and workers
        run: pnpm -r build

      # --- Build worker images (linux/amd64) ---
      - name: Docker build worker images
        run: |
          TAG="v${GITHUB_RUN_NUMBER}"

          echo "Building images with tag $TAG ..."

          docker build \
            --platform linux/amd64 \
            -t $AZURE_CONTAINER_REGISTRY/${SCRAPER_APP}:$TAG \
            -f apps/worker-scraper/Dockerfile .

          docker build \
            --platform linux/amd64 \
            -t $AZURE_CONTAINER_REGISTRY/${TRACKER_APP}:$TAG \
            -f apps/worker-tracker/Dockerfile .

          docker build \
            --platform linux/amd64 \
            -t $AZURE_CONTAINER_REGISTRY/${AUTOSELL_APP}:$TAG \
            -f apps/worker-autosell/Dockerfile .

          # Optionally tag as 'latest'
          docker tag $AZURE_CONTAINER_REGISTRY/${SCRAPER_APP}:$TAG $AZURE_CONTAINER_REGISTRY/${SCRAPER_APP}:latest
          docker tag $AZURE_CONTAINER_REGISTRY/${TRACKER_APP}:$TAG $AZURE_CONTAINER_REGISTRY/${TRACKER_APP}:latest
          docker tag $AZURE_CONTAINER_REGISTRY/${AUTOSELL_APP}:$TAG $AZURE_CONTAINER_REGISTRY/${AUTOSELL_APP}:latest

      - name: Push worker images to ACR
        run: |
          TAG="v${GITHUB_RUN_NUMBER}"

          echo "Pushing images with tag $TAG ..."

          docker push $AZURE_CONTAINER_REGISTRY/${SCRAPER_APP}:$TAG
          docker push $AZURE_CONTAINER_REGISTRY/${TRACKER_APP}:$TAG
          docker push $AZURE_CONTAINER_REGISTRY/${AUTOSELL_APP}:$TAG

          docker push $AZURE_CONTAINER_REGISTRY/${SCRAPER_APP}:latest
          docker push $AZURE_CONTAINER_REGISTRY/${TRACKER_APP}:latest
          docker push $AZURE_CONTAINER_REGISTRY/${AUTOSELL_APP}:latest

      # --- Set secrets on Container Apps (if not already set) ---
      - name: Sync Supabase secrets to Container Apps
        run: |
          # NOTE: you set these values in GitHub as encrypted secrets.
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          for APP in "${SCRAPER_APP}" "${TRACKER_APP}" "${AUTOSELL_APP}"; do
            echo "Setting secrets for $APP ..."
            az containerapp secret set \
              --name "$APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets \
                supabase-url="$SUPABASE_URL" \
                supabase-service-role-key="$SUPABASE_SERVICE_ROLE_KEY" \
                supabase-anon-key="$SUPABASE_ANON_KEY"
          done

      # --- Update container apps to new images + env vars ---
      - name: Update Container Apps to new images
        run: |
          TAG="v${GITHUB_RUN_NUMBER}"

          echo "Updating $SCRAPER_APP ..."
          az containerapp update \
            --name "$SCRAPER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_CONTAINER_REGISTRY/$SCRAPER_APP:$TAG" \
            --set-env-vars \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              SUPABASE_ANON_KEY=secretref:supabase-anon-key \
              NODE_ENV=production \
              LOG_LEVEL=info

          echo "Updating $TRACKER_APP ..."
          az containerapp update \
            --name "$TRACKER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_CONTAINER_REGISTRY/$TRACKER_APP:$TAG" \
            --set-env-vars \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              SUPABASE_ANON_KEY=secretref:supabase-anon-key \
              NODE_ENV=production \
              LOG_LEVEL=info

          echo "Updating $AUTOSELL_APP ..."
          az containerapp update \
            --name "$AUTOSELL_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_CONTAINER_REGISTRY/$AUTOSELL_APP:$TAG" \
            --set-env-vars \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key \
              SUPABASE_ANON_KEY=secretref:supabase-anon-key \
              NODE_ENV=production \
              LOG_LEVEL=info

      - name: Verify Container App status
        run: |
          az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?contains(name, 'worker')].{Name:name, Status:properties.provisioningState, Running:properties.runningStatus}" \
            --output table

