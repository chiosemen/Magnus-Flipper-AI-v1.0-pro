name: Pre-Launch Secrets Gate

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run Secrets Integrity Gate
        run: pnpm secrets:gate
