name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      specific_version:
        description: 'Specific version (overrides version_type)'
        required: false
        type: string
      skip_deploy:
        description: 'Skip deployment triggers'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: "20"
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}

jobs:
  release:
    runs-on: ubuntu-latest
    name: Create Release
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Bump version ---
      - name: Bump version
        id: bump
        run: |
          chmod +x scripts/release/bump-version.sh
          if [ -n "${{ inputs.specific_version }}" ]; then
            ./scripts/release/bump-version.sh patch "${{ inputs.specific_version }}"
          else
            ./scripts/release/bump-version.sh "${{ inputs.version_type }}"
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          chmod +x scripts/release/generate-changelog.js
          NEW_VERSION=${{ steps.bump.outputs.version }} node scripts/release/generate-changelog.js

      # --- Build and validate ---
      - name: Build packages
        run: pnpm build:packages

      - name: Run lint
        run: pnpm lint

      # --- Commit version bump and changelog ---
      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json apps/*/package.json packages/*/package.json CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}" || exit 0
          git push origin HEAD:${{ github.ref }}

      # --- Create Git tag ---
      - name: Create Git tag
        run: |
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      # --- Get Docker image digests ---
      - name: Get Docker image digests
        id: digests
        if: steps.bump.outputs.version
        run: |
          # Azure login
          echo "${{ secrets.AZURE_CREDENTIALS }}" > azure_creds.json
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}" || true
          
          az acr login --name "${{ env.AZURE_ACR_NAME }}" || true
          
          # Get latest staging digests
          SCRAPER_DIGEST=$(az acr repository show-tags \
            --name "${{ env.AZURE_ACR_NAME }}" \
            --repository worker-scraper \
            --orderby time_desc \
            --query "[?starts_with(name, 'staging-')].digest" \
            -o tsv | head -1) || echo ""
          
          TRACKER_DIGEST=$(az acr repository show-tags \
            --name "${{ env.AZURE_ACR_NAME }}" \
            --repository worker-tracker \
            --orderby time_desc \
            --query "[?starts_with(name, 'staging-')].digest" \
            -o tsv | head -1) || echo ""
          
          AUTOSELL_DIGEST=$(az acr repository show-tags \
            --name "${{ env.AZURE_ACR_NAME }}" \
            --repository worker-autosell \
            --orderby time_desc \
            --query "[?starts_with(name, 'staging-')].digest" \
            -o tsv | head -1) || echo ""
          
          echo "scraper_digest=$SCRAPER_DIGEST" >> $GITHUB_OUTPUT
          echo "tracker_digest=$TRACKER_DIGEST" >> $GITHUB_OUTPUT
          echo "autosell_digest=$AUTOSELL_DIGEST" >> $GITHUB_OUTPUT

      # --- Generate release notes ---
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="${{ steps.bump.outputs.tag }}"
          
          # Read changelog entry
          CHANGELOG_ENTRY=$(awk "/^## \\[${VERSION}\\]/,/^## \\[/{if (!/^## \\[/ || /^## \\[${VERSION}\\]/) print}" CHANGELOG.md | head -n -1)
          
          NOTES="## Release $TAG
          
          $CHANGELOG_ENTRY
          
          ### Docker Images
          
          - **worker-scraper**: \`${{ steps.digests.outputs.scraper_digest || 'N/A' }}\`
          - **worker-tracker**: \`${{ steps.digests.outputs.tracker_digest || 'N/A' }}\`
          - **worker-autosell**: \`${{ steps.digests.outputs.autosell_digest || 'N/A' }}\`
          
          ### Deployment
          
          To promote this release to production, use the [Promote Release workflow](.github/workflows/promote-release.yml) with version \`$TAG\`.
          "
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Create GitHub Release ---
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          release_name: Release ${{ steps.bump.outputs.tag }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false

      # --- Trigger Vercel deployment (optional) ---
      - name: Trigger Vercel deployment
        if: inputs.skip_deploy == false
        run: |
          echo "Vercel deployment would be triggered here"
          # Add Vercel deployment trigger if needed
          # vercel --prod --token ${{ secrets.VERCEL_TOKEN }}

      # --- Trigger Azure staging deployment (optional) ---
      - name: Trigger Azure staging deployment
        if: inputs.skip_deploy == false
        run: |
          echo "Azure staging deployment would be triggered here"
          # The stage-and-promote workflow will handle staging on push to main

      # --- Summary ---
      - name: Release summary
        run: |
          echo "## ✅ Release ${{ steps.bump.outputs.tag }} Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.bump.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.bump.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changelog**: Updated" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: Created" >> $GITHUB_STEP_SUMMARY

