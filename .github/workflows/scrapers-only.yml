name: scrapers-only ruthless mode

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scrapers:
    name: Scrapers Only (No Infra, No Terraform, No DeployGuardian)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @magnus-flipper-ai/core build

      - name: Build scraper-sync
        run: pnpm --filter @magnus-flipper-ai/scraper-sync build

      - name: Build worker-scraper
        run: pnpm --filter worker-scraper build

      - name: Run scrapers
        run: |
          pnpm --filter worker-scraper run scrape

      - name: Scraper smoke test
        run: |
          echo "🔥 Scrapers-only ruthless mode"
          echo "No Terraform. No Prisma. No Infra."
          echo "Build passed."
