name: typecheck

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify env (web)
        working-directory: apps/web
        run: node ../../scripts/check-supabase-env.mjs
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Lint
        run: pnpm -w lint

      - name: Typecheck
        run: pnpm -r --workspace-concurrency 1 run typecheck --if-present

      - name: Build
        run: pnpm -r --workspace-concurrency 1 run build --if-present

      - name: Web tests
        run: pnpm --filter @magnus/web test -- --run

      - name: Mobile tests
        run: pnpm --filter magnus-flipper-mobile test
