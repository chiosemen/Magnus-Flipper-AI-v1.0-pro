name: Verify Pooled-Only Architecture

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  verify-architecture:
    name: Verify Pooled-Only Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pooled-only verification
        run: npx tsx scripts/verify-pooled-only.ts

      - name: Report result
        if: success()
        run: |
          echo "✅ Architecture verification passed"
          echo "Pooled-only invariants intact"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Architecture verification FAILED"
          echo "Legacy per-search code detected"
          echo "See logs above for violations"
          exit 1
