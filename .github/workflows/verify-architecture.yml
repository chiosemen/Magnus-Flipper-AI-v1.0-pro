name: Verify Architecture

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  verify-elite-pool-economics:
    name: Verify Elite Pool Economics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @magnus-flipper-ai/marketplace-config build
          pnpm --filter @magnus-flipper-ai/core build

      - name: Run Elite Pool Economics Verification
        run: pnpm tsx scripts/verify-elite-pool-economics.ts
        env:
          MIN_ELITE_SUBS: ${{ vars.MIN_ELITE_SUBS || '0' }}
          ELITE_PRICE: ${{ vars.ELITE_PRICE || '29.99' }}

      - name: Report verification status
        if: failure()
        run: |
          echo "❌ Elite Pool Economics verification failed!"
          echo "Please review the violations above and fix them before merging."
          exit 1
