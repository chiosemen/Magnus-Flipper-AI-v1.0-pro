name: Build & Deploy Worker

on:
  push:
    branches: [main]

env:
  ACR_NAME: magnusacr
  IMAGE_NAME: magnus-worker
  RESOURCE_GROUP: magnus-rg
  CONTAINER_APP: magnus-worker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @magnus-flipper-ai/core prisma:generate

      - name: Build worker
        run: pnpm --filter magnus-worker build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login -n $ACR_NAME

      - name: Build & Push Image
        run: |
          docker build \
            -f apps/worker/Dockerfile \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:latest \
            .
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:latest
