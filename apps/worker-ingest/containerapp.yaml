# Azure Container App for worker-ingest
# Deploy with: az containerapp create --resource-group magnus-workers-rg --name magnus-worker-ingest --yaml apps/worker-ingest/containerapp.yaml
# Note: Replace <UPSTASH_TOKEN> with actual Upstash Redis token before deployment

apiVersion: 2024-03-01
kind: containerApp
properties:
  managedEnvironmentId: /subscriptions/<SUB_ID>/resourceGroups/magnus-workers-rg/providers/Microsoft.App/containerAppsEnvironments/magnus-worker-env
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      allowInsecure: false
  template:
    containers:
      - name: worker-ingest
        image: magnusworkersacr.azurecr.io/worker-ingest:latest
        env:
          - name: REDIS_URL
            value: "redis://default:<UPSTASH_TOKEN>@hip-platypus-20977.upstash.io:6379"
          - name: NODE_ENV
            value: "production"
          - name: INGEST_CONCURRENCY
            value: "10"
          - name: FB_BATCH_CONCURRENCY
            value: "2"
          - name: PLAYWRIGHT_HEADLESS
            value: "true"
        resources:
          cpu: 0.5
          memory: 1.0Gi
    scale:
      minReplicas: 1
      maxReplicas: 3
