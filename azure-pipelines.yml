trigger:
  branches:
    include:
      - main

variables:
  resourceGroup: 'MagnusRG'
  acrName: 'MagnusACR'
  acrLoginServer: 'MagnusACR.azurecr.io'
  apiImageName: 'magnus/api'
  workerImageName: 'magnus/worker'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build and push images
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          # 🔥 REQUIRED FOR WORKLOAD IDENTITY FEDERATION (WIF)
          - task: AzureCLI@2
            displayName: 'Login to Azure via service connection'
            inputs:
              azureSubscription: 'AZURE-SC'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Logged into Azure via WIF"

          # 🔥 Use az acr login (works after WIF login)
          - bash: |
              az acr login --name $(acrName)
            displayName: 'ACR Login'

          # 🔥 Build + Push Images
          - bash: |
              docker build -t $(acrLoginServer)/$(apiImageName):$(tag) ./magnus-mvp/api
              docker build -t $(acrLoginServer)/$(workerImageName):$(tag) ./magnus-mvp/worker
              docker push $(acrLoginServer)/$(apiImageName):$(tag)
              docker push $(acrLoginServer)/$(workerImageName):$(tag)
            displayName: 'Build and push Docker images'

  - stage: Deploy
    displayName: Deploy infra with Terraform
    dependsOn: Build
    jobs:
      - job: ApplyTerraform
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          # 🔥 MUST LOGIN AGAIN IN DEPLOY STAGE FOR WIF
          - task: AzureCLI@2
            displayName: 'Login to Azure for Terraform'
            inputs:
              azureSubscription: 'AZURE-SC'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Azure login OK (Terraform stage)"

          - bash: |
              cd infra
              terraform init
              terraform apply \
                -auto-approve \
                -var "resource_group_name=$(resourceGroup)" \
                -var "api_image=$(acrLoginServer)/$(apiImageName):$(tag)" \
                -var "worker_image=$(acrLoginServer)/$(workerImageName):$(tag)"
            displayName: 'Terraform Apply'
