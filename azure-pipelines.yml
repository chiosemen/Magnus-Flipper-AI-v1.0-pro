trigger:
  branches:
    include:
      - main

variables:
  resourceGroup: 'MagnusRG'
  acrName: 'MagnusACR'
  acrLoginServer: 'MagnusACR.azurecr.io'
  apiImageName: 'magnus/api'
  workerImageName: 'magnus/worker'
  tag: '$(Build.BuildId)'
  nodeVersion: '20.x'

stages:
  # CI Validation Stage - Enforces CI Invariant Order
  - stage: CIValidation
    displayName: CI Validation (Invariant-Compliant)
    jobs:
      - job: WebLintAndTypecheck
        displayName: 🔍 Web Lint & Type Check
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 10

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: '🟦 Setup Node.js 20'
            inputs:
              versionSpec: '$(nodeVersion)'

          - bash: |
              corepack enable
              corepack prepare pnpm@latest --activate
              pnpm --version
            displayName: '🟣 Install pnpm'

          - bash: |
              bash scripts/ci-preflight.sh
            displayName: '🛡️ CI Preflight'
            continueOnError: false

          - bash: |
              pnpm -w install --frozen-lockfile
            displayName: '📦 Install dependencies'

          - bash: |
              pnpm build:packages
            displayName: '🔨 Build workspace packages'

          - bash: |
              pnpm --filter web lint
            displayName: '🔍 Lint (web)'

          - bash: |
              pnpm --filter web typecheck
            displayName: '📝 Type check (web)'

      - job: WebTest
        displayName: '🧪 Web Tests'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 10

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: '🟦 Setup Node.js 20'
            inputs:
              versionSpec: '$(nodeVersion)'

          - bash: |
              corepack enable
              corepack prepare pnpm@latest --activate
              pnpm --version
            displayName: '🟣 Install pnpm'

          - bash: |
              bash scripts/ci-preflight.sh
            displayName: '🛡️ CI Preflight'
            continueOnError: false

          - bash: |
              pnpm -w install --frozen-lockfile
            displayName: '📦 Install dependencies'

          - bash: |
              pnpm build:packages
            displayName: '🔨 Build workspace packages'

          - bash: |
              pnpm --filter web test
            displayName: '🧪 Run tests (web)'

      - job: WebBuild
        displayName: '🏗️ Web Build'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 15

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: '🟦 Setup Node.js 20'
            inputs:
              versionSpec: '$(nodeVersion)'

          - bash: |
              corepack enable
              corepack prepare pnpm@latest --activate
              pnpm --version
            displayName: '🟣 Install pnpm'

          - bash: |
              bash scripts/ci-preflight.sh
            displayName: '🛡️ CI Preflight'
            continueOnError: false

          - bash: |
              pnpm -w install --frozen-lockfile
            displayName: '📦 Install dependencies'

          - bash: |
              pnpm build:web
            displayName: '🏗️ Build web app'
            env:
              NEXT_PUBLIC_SUPABASE_URL: $(NEXT_PUBLIC_SUPABASE_URL)
              NEXT_PUBLIC_SUPABASE_ANON_KEY: $(NEXT_PUBLIC_SUPABASE_ANON_KEY)

      - job: MobileLintAndTypecheck
        displayName: '🔍 Mobile Lint & Type Check'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 10

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: '🟦 Setup Node.js 20'
            inputs:
              versionSpec: '$(nodeVersion)'

          - bash: |
              corepack enable
              corepack prepare pnpm@latest --activate
              pnpm --version
            displayName: '🟣 Install pnpm'

          - bash: |
              bash scripts/ci-preflight.sh
            displayName: '🛡️ CI Preflight'
            continueOnError: false

          - bash: |
              pnpm -w install --frozen-lockfile
            displayName: '📦 Install dependencies'

          - bash: |
              pnpm build:packages
            displayName: '🔨 Build workspace packages'

          - bash: |
              pnpm --filter @magnus-flipper-ai/mobile lint
            displayName: '🔍 Lint (mobile)'

          - bash: |
              pnpm --filter @magnus-flipper-ai/mobile type-check
            displayName: '📝 Type check (mobile)'

  # Docker Build Stage - Only runs after CI validation passes
  - stage: Build
    displayName: Build and push images
    dependsOn: CIValidation
    condition: succeeded()
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          # 🔥 REQUIRED FOR WORKLOAD IDENTITY FEDERATION (WIF)
          - task: AzureCLI@2
            displayName: 'Login to Azure via service connection'
            inputs:
              azureSubscription: 'AZURE-SC'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Logged into Azure via WIF"

          # 🔥 Use az acr login (works after WIF login)
          - bash: |
              az acr login --name $(acrName)
            displayName: 'ACR Login'

          # 🔥 Build + Push API Image (using root Dockerfile.api)
          - bash: |
              docker build -f Dockerfile.api -t $(acrLoginServer)/$(apiImageName):$(tag) .
            displayName: 'Build and push API Docker image'

          # 🔥 Build + Push Worker Image (using apps/worker/Dockerfile if exists, or create worker build)
          - bash: |
              if [ -f "apps/worker/Dockerfile" ]; then
                docker build -f apps/worker/Dockerfile -t $(acrLoginServer)/$(workerImageName):$(tag) .
              elif [ -f "Dockerfile.worker-alerts" ]; then
                docker build -f Dockerfile.worker-alerts -t $(acrLoginServer)/$(workerImageName):$(tag) .
              else
                echo "No worker Dockerfile found. Skipping worker build."
                exit 1
              fi
            displayName: 'Build and push Worker Docker image'

  # Deployment Stage - Only runs after build succeeds
  - stage: Deploy
    displayName: Deploy infra with Terraform
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: ApplyTerraform
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          # 🔥 MUST LOGIN AGAIN IN DEPLOY STAGE FOR WIF
          - task: AzureCLI@2
            displayName: 'Login to Azure for Terraform'
            inputs:
              azureSubscription: 'AZURE-SC'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Azure login OK (Terraform stage)"

          - bash: |
              cd infra
              terraform init
              terraform apply \
                -auto-approve \
                -var "resource_group_name=$(resourceGroup)" \
                -var "api_image=$(acrLoginServer)/$(apiImageName):$(tag)" \
                -var "worker_image=$(acrLoginServer)/$(workerImageName):$(tag)"
            displayName: 'Terraform Apply'
