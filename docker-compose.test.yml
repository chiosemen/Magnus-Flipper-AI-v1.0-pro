version: '3.8'

services:
  postgres-test:
    image: postgres:15
    container_name: magnus-test-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: magnus_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: magnus-test-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - redis-test-data:/data

volumes:
  postgres-test-data:
  redis-test-data:

