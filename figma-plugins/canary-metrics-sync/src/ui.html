<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px;
      margin: 0;
      background: #ffffff;
      color: #1f2328;
    }
    .section {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #656d76;
    }
    input, select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d9e0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0969da;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #0860ca;
    }
    button.secondary {
      background: #f6f8fa;
      color: #1f2328;
      border: 1px solid #d1d9e0;
    }
    button.secondary:hover {
      background: #e7ebf0;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 13px;
      white-space: pre-line;
    }
    .status.success {
      background: #dafbe1;
      color: #1a7f37;
    }
    .status.error {
      background: #ffebe9;
      color: #cf222e;
    }
    .status.info {
      background: #ddf4ff;
      color: #0969da;
    }
    #statusMessage {
      display: none;
    }
  </style>
</head>
<body>
  <h2 style="margin-top: 0; font-size: 18px;">Canary Metrics Sync</h2>
  
  <div class="section">
    <label>Base API URL</label>
    <input type="text" id="apiUrl" placeholder="https://api.example.com or http://localhost:3000" />
  </div>
  
  <div class="section">
    <label>API Key (Optional)</label>
    <input type="password" id="apiKey" placeholder="Bearer token" />
  </div>
  
  <div class="section">
    <label>Environment</label>
    <select id="environment">
      <option value="production">Production</option>
      <option value="staging">Staging</option>
      <option value="local">Local</option>
    </select>
  </div>
  
  <button id="testApi" class="secondary">Test API Connection</button>
  <button id="syncNow">Sync Metrics Now</button>
  <button id="saveConfig" class="secondary">Save Configuration</button>
  
  <div id="statusMessage" class="status"></div>
  
  <script src="ui.js"></script>
</body>
</html>
