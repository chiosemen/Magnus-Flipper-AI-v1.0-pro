name: Magnus Cloud Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  ios:
    runs-on: macos-ventura-xcode-16
    steps:
      - uses: actions/checkout@v4

      - name: Install Node + pnpm
        run: |
          npm i -g pnpm

      - name: Install dependencies
        run: |
          cd mobile
          pnpm install

      - name: Configure EAS
        run: |
          cd mobile
          npx eas build:configure

      - name: Build iOS (Development)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd mobile
          npx eas build -p ios --profile development --non-interactive

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node + pnpm
        run: |
          npm i -g pnpm

      - name: Install dependencies
        run: |
          cd mobile
          pnpm install

      - name: Build Android (Development)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd mobile
          npx eas build -p android --profile development --non-interactive
