name: Tag Mobile Release

on:
  push:
    tags:
      - "mobile-v*"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Echo Release Version
        run: echo "Building for tag $GITHUB_REF"

      - name: Install Node + pnpm
        run: |
          npm i -g pnpm

      - name: Install dependencies
        run: |
          cd mobile
          pnpm install

      - name: Trigger OTA to Production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd mobile
          npx eas update --branch production --message "Production release $GITHUB_REF"
