openapi: 3.1.0
info:
  title: Deploy-Guardian API
  version: 1.0.0
  description: Operational control plane for ingestion health, invariants, canaries, and alerts.
servers:
  - url: https://guardian.yourdomain.com
    description: Production
  - url: http://localhost:4010
    description: Local

security:
  - GuardianKey: []

components:
  securitySchemes:
    GuardianKey:
      type: apiKey
      in: header
      name: X-Guardian-Key

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: "null"

    HealthResponse:
      type: object
      required: [status, version, uptime_seconds, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        uptime_seconds:
          type: number
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok:
                type: boolean
              latency_ms:
                type: number
              message:
                type: string

    Marketplace:
      type: string
      enum: [facebook, vinted, gumtree, cex, ebay, craigslist, other]

    LatestResponse:
      type: object
      required: [marketplace, last_run_at, last_ok_at, lag_seconds]
      properties:
        marketplace:
          $ref: "#/components/schemas/Marketplace"
        last_run_at:
          type: string
          format: date-time
        last_ok_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        last_error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
                at:
                  type: string
                  format: date-time
            - type: "null"
        lag_seconds:
          type: number

    IngestionRun:
      type: object
      required: [id, marketplace, started_at, status, items, errors_count]
      properties:
        id:
          type: string
        marketplace:
          $ref: "#/components/schemas/Marketplace"
        started_at:
          type: string
          format: date-time
        ended_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        status:
          type: string
          enum: [ok, error, running, skipped, disabled]
        items:
          type: number
        errors_count:
          type: number
        meta:
          oneOf:
            - type: object
            - type: "null"

    IngestionRunsResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/IngestionRun"

    InvariantScope:
      type: string
      enum: [global, marketplace]

    Severity:
      type: string
      enum: [info, warn, critical]

    InvariantViolation:
      type: object
      required: [code, severity, message, observed, expected]
      properties:
        code:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
        observed:
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: "null"
        expected:
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: "null"

    InvariantsEvaluateRequest:
      type: object
      required: [scope]
      properties:
        scope:
          $ref: "#/components/schemas/InvariantScope"
        marketplace:
          $ref: "#/components/schemas/Marketplace"
        window_minutes:
          type: number
          minimum: 1
          default: 60

    InvariantsEvaluateResponse:
      type: object
      required: [ok, violations]
      properties:
        ok:
          type: boolean
        violations:
          type: array
          items:
            $ref: "#/components/schemas/InvariantViolation"

    CanaryTarget:
      type: string
      enum: [auth, scrape, db, api]

    CanaryMode:
      type: string
      enum: [read-only, synthetic]

    CanaryRunRequest:
      type: object
      required: [targets, mode]
      properties:
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CanaryTarget"
        mode:
          $ref: "#/components/schemas/CanaryMode"

    CanaryResult:
      type: object
      required: [target, ok, latency_ms]
      properties:
        target:
          $ref: "#/components/schemas/CanaryTarget"
        ok:
          type: boolean
        latency_ms:
          type: number
        details:
          oneOf:
            - type: object
            - type: "null"

    CanaryRunResponse:
      type: object
      required: [ok, results]
      properties:
        ok:
          type: boolean
        results:
          type: array
          items:
            $ref: "#/components/schemas/CanaryResult"

    AlertCategory:
      type: string
      enum: [ingestion, invariant, canary, auth, billing, system]

    Alert:
      type: object
      required: [id, severity, category, message, created_at]
      properties:
        id:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        category:
          $ref: "#/components/schemas/AlertCategory"
        message:
          type: string
        created_at:
          type: string
          format: date-time
        context:
          oneOf:
            - type: object
            - type: "null"

    AlertsResponse:
      type: object
      required: [alerts]
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"

paths:
  /api/guardian/health:
    get:
      summary: Health and readiness status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/guardian/latest:
    get:
      summary: Latest ingestion snapshot for a marketplace
      parameters:
        - in: query
          name: marketplace
          required: true
          schema:
            $ref: "#/components/schemas/Marketplace"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/guardian/ingestion/runs:
    get:
      summary: Recent ingestion runs
      parameters:
        - in: query
          name: marketplace
          required: true
          schema:
            $ref: "#/components/schemas/Marketplace"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionRunsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/guardian/invariants/evaluate:
    post:
      summary: Evaluate invariants over a time window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvariantsEvaluateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvariantsEvaluateResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/guardian/canary/run:
    post:
      summary: Run canary checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanaryRunRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanaryRunResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/guardian/alerts:
    get:
      summary: List recent alerts
      parameters:
        - in: query
          name: since
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsResponse"
