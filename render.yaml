    name: magnus-worker-analyzer
    env: docker
    autoDeploy: true
    branch: main
    dockerfilePath: apps/worker-analyzer/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: REDIS_HOST
        fromService:
          type: redis
          name: magnus-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: magnus-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    plan: starter
    region: oregon

  # ------------------------------
  # WORKER: ALERTS
  # ------------------------------
  - type: worker
    name: magnus-worker-alerts
    env: docker
    autoDeploy: true
    branch: main
    dockerfilePath: apps/worker-alerts/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
