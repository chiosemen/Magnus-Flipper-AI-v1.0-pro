services:
  # =========================
  # API SERVICE (HTTP) - AUTO-DEPLOY ENABLED (Client-facing)
  # =========================
  - type: web
    name: magnus-flipper-api
    runtime: node
    plan: free
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: true

  # =========================
  # SCHEDULER WORKER - MANUAL DEPLOY (Conserve build minutes)
  # =========================
  - type: worker
    name: magnus-scheduler
    runtime: node
    plan: starter
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start:scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
    autoDeploy: false

  # =========================
  # CRAWLER WORKER - MANUAL DEPLOY (Conserve build minutes)
  # =========================
  - type: worker
    name: magnus-worker-crawler
    runtime: node
    plan: starter
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start:worker-crawler
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
    autoDeploy: false

  # =========================
  # ANALYZER WORKER - MANUAL DEPLOY (Conserve build minutes)
  # =========================
  - type: worker
    name: magnus-worker-analyzer
    runtime: node
    plan: starter
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start:worker-analyzer
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
    autoDeploy: false

  # =========================
  # ALERTS WORKER - MANUAL DEPLOY (Conserve build minutes)
  # =========================
  - type: worker
    name: magnus-worker-alerts
    runtime: node
    plan: starter
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start:worker-alerts
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
    autoDeploy: false

  # =========================
  # TELEGRAM BOT - MANUAL DEPLOY (Conserve build minutes)
  # =========================
  - type: worker
    name: magnus-telegram-bot
    runtime: node
    plan: starter
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start:bot-telegram
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: magnus-flipper-redis
          property: port
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
    autoDeploy: false

  # =========================
  # REDIS (Managed Key-Value Store)
  # =========================
  - type: keyvalue
    name: magnus-flipper-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
