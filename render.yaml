services:
  # ------------------------------
  # API SERVICE
  # ------------------------------
  - type: web
    name: magnus-api
    env: docker
    autoDeploy: true
    branch: main
    dockerfilePath: apps/api/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: REDIS_HOST
        fromService:
          type: redis
          name: magnus-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: magnus-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /health
    plan: starter
    region: oregon

  # ------------------------------
  # SCHEDULER
  # ------------------------------
  - type: worker
    name: magnus-scheduler
    env: docker
    autoDeploy: true
    branch: main
    dockerfilePath: apps/scheduler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: REDIS_HOST
        fromService:
          type: redis
          name: magnus-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: magnus-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    plan: starter
    region: oregon

  # ------------------------------
  # WORKER: CRAWLER
  # ------------------------------
  - type: worker
    name: magnus-worker-crawler
    env: docker
    autoDeploy: true
    branch: main
    dockerfilePath: apps/worker-crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: REDIS_HOST
        fromService:
          type: redis
          name: magnus-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: magnus-redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    plan: starter
    region: oregon

  # ------------------------------
  # WORKER: ANALYZER
  # ------------------------------
